name: Build release package

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to package, vYYYY.MM.NN (for example v2026.09.01)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-\${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: \${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Verify release tag and commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          # vYYYY.MM.NN: NN numbers that month's releases from 01; it is not the day.
          node scripts/release.mjs --check-tag "$RELEASE_TAG" || {
            [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] || {
              echo "Invalid release tag format: $RELEASE_TAG. Expected vYYYY.MM.NN." >&2
              exit 1
            }
          }
          commit="$(git rev-parse HEAD)"
          tagged_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$commit" = "$tagged_commit" || {
            echo "Release tag $RELEASE_TAG must point to HEAD commit $commit." >&2
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Run template tests
        run: node --test tests/*.test.mjs
      - name: Create GitHub Release
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Aggregate GTM Template $RELEASE_TAG" \
            --generate-notes \
            template.tpl metadata.yaml LICENSE
