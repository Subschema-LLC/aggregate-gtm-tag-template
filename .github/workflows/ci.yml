name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
  # Recheck on a weekly schedule
  schedule:
    - cron: '37 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node \${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js \${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: \${{ matrix.node-version }}
      - name: Check git diff formatting
        run: git diff --check
      - name: Run test suites
        run: node --test tests/*.test.mjs

  # Require this stable check in branch protection; matrix changes won't require
  # editing the protection rule. A failed, cancelled, or skipped job fails CI.
  ci:
    name: CI
    if: \${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_RESULT: \${{ needs.test.result }}
    steps:
      - name: Require all checks to pass
        run: |
          test "$TEST_RESULT" = success
